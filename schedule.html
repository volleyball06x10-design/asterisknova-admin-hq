<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTERISKNOVA 練習・大会日程</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:1000px;margin:auto;padding:16px}header{background:#102a56;color:#fff;padding:22px;border-radius:20px;margin-bottom:14px}h1{margin:3px 0;font-size:24px}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 3px 14px #102a5612}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}input,select,button{width:100%;padding:11px;border:1px solid #d7dce5;border-radius:10px;font:inherit}.tabs{display:flex;gap:7px}.tabs button{background:#eef2f7;font-weight:800}.tabs .on{background:#102a56;color:#fff}.view{display:flex;gap:7px;margin-top:10px}.view button{width:auto;background:#eef2f7}.view .on{background:#102a56;color:#fff}.day{background:#fff;border:1px solid #e5e9f0;border-radius:15px;margin-bottom:10px;overflow:hidden}.day summary{padding:14px;font-weight:900;cursor:pointer;list-style:none}.event{border-top:1px solid #edf0f4;padding:13px 15px;display:grid;grid-template-columns:85px 1fr auto;gap:10px;align-items:center}.badge{font-size:12px;font-weight:900;border-radius:99px;padding:5px 8px;text-align:center}.practice{background:#ecfdf3;color:#067647}.tournament{background:#fff7ed;color:#b54708}.meta{font-size:12px;color:#667085;margin-top:4px}.level{font-weight:900}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;font-size:12px;font-weight:800;color:#667085}.cell{background:#fff;border:1px solid #e5e9f0;border-radius:12px;min-height:105px;padding:8px}.cell.off{opacity:.35}.num{font-weight:900}.dot{display:block;font-size:11px;margin-top:5px;padding:4px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{background:#fff;padding:24px;border-radius:14px;color:#667085}.count{font-size:13px;color:#dbe7ff}.back{display:inline-block;color:#fff;margin-top:8px}.hidden{display:none}@media(max-width:650px){.controls{grid-template-columns:1fr}.event{grid-template-columns:76px 1fr}.level{grid-column:2}.calendar{gap:3px}.cell{min-height:78px;padding:5px}.dot{font-size:9px;padding:3px}h1{font-size:21px}}</style></head><body><div class="wrap"><header><small>合同会社ASTERISKNOVA</small><h1>🏐 練習・大会 日程表</h1><div class="count">練習と大会をまとめて確認できます</div><a class="back" href="/">← 管理本部へ戻る</a></header><section class="card"><div class="controls"><label>月<input id="month" type="month" value="2026-09"></label><label>日付ジャンプ<input id="jump" type="date"></label><label>検索<input id="q" placeholder="場所・レベル・大会名"></label></div><div class="tabs" style="margin-top:10px"><button class="on" data-type="all">全部</button><button data-type="practice">練習</button><button data-type="tournament">大会</button></div><div class="view"><button class="on" data-view="list">☰ 一覧</button><button data-view="calendar">📅 カレンダー</button></div></section><div id="list"></div><div id="cal" class="hidden"></div></div><script>const E=[['2026-09-16','practice','馬込文化センター','19:00–22:00','⭐🌺',''],['2026-09-16','practice','王子特別支援','18:00–21:00','🌸',''],['2026-09-16','practice','北沢中','18:30–21:00','🌺🌸',''],['2026-09-17','practice','馬込文化センター','19:00–22:00','⭐🌺',''],['2026-09-17','practice','北特別支援','18:00–21:00','🌸',''],['2026-09-17','practice','北の台','18:00–21:00','🌸💎',''],['2026-09-18','practice','王子特別支援','18:00–21:00','🌸',''],['2026-09-18','practice','武蔵丘','18:30–21:00','🌺🌸',''],['2026-09-19','practice','練馬特別支援','15:00–18:00','🌸',''],['2026-09-19','tournament','清瀬ひまわり','13:00–17:00','混合DE',''],['2026-09-19','practice','西荻','17:00–21:00','⭐',''],['2026-09-19','practice','杉並四宮','18:00–21:00','🌺',''],['2026-09-20','tournament','清瀬','13:00–17:00','男子',''],['2026-09-20','practice','西荻','17:00–21:00','🌺🌸',''],['2026-09-20','tournament','光明学園','12:00–18:00','🌠 個人参加大会',''],['2026-09-22','tournament','北区教育総合','9:00–18:00','混合D',''],['2026-09-26','tournament','世田谷総合','9:00–15:00','男子',''],['2026-09-26','tournament','世田谷総合','15:00–21:00','混合E',''],['2026-09-26','tournament','春日部サブ','9:00–15:30','混合C',''],['2026-09-26','tournament','春日部サブ','15:30–21:30','混合D',''],['2026-09-27','tournament','清瀬ひまわり','9:00–17:00','混合CD',''],['2026-10-04','tournament','北区桐ケ丘','9:00–15:00','DE',''],['2026-10-10','tournament','世田谷総合','午前','CD',''],['2026-10-10','tournament','世田谷総合','午後','D',''],['2026-10-12','tournament','神奈川県立スポーツセンター','18:00–21:00','C',''],['2026-10-12','tournament','神奈川県立スポーツセンター','18:00–21:00','D',''],['2026-10-18','tournament','蓮田総合','12:00–21:00','混合CD','']];let type='all',view='list';const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function filtered(){const m=$('month').value,q=$('q').value.trim().toLowerCase();return E.filter(x=>x[0].startsWith(m)&&(type==='all'||x[1]===type)&&(!q||x.slice(2).join(' ').toLowerCase().includes(q)))}function renderList(){const a=filtered(),g={};a.forEach(x=>(g[x[0]]??=[]).push(x));$('list').innerHTML=a.length?Object.entries(g).map(([d,v])=>`<details class="day" open id="d-${d}"><summary>📅 ${Number(d.slice(5,7))}/${Number(d.slice(8))}　${v.length}件</summary>${v.map(x=>`<div class="event"><span class="badge ${x[1]}">${x[1]==='practice'?'練習':'大会'}</span><div><b>${esc(x[2])}</b><div class="meta">${esc(x[3])}${x[5]?' ／ 参加費 '+esc(x[5]):''}</div></div><div class="level">${esc(x[4])}</div></div>`).join('')}</details>`).join(''):'<div class="empty">この条件の日程はありません。</div>'}function renderCal(){const a=filtered(),m=$('month').value,[y,mo]=m.split('-').map(Number),first=new Date(y,mo-1,1),last=new Date(y,mo,0).getDate(),start=first.getDay();let h='<section class="calendar">'+['日','月','火','水','木','金','土'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<start;i++)h+='<div class="cell off"></div>';for(let d=1;d<=last;d++){const ds=m+'-'+String(d).padStart(2,'0'),v=a.filter(x=>x[0]===ds);h+=`<div class="cell"><div class="num">${d}</div>${v.map(x=>`<span class="dot ${x[1]}">${x[1]==='practice'?'練':'大'} ${esc(x[2])}</span>`).join('')}</div>`}h+='</section>';$('cal').innerHTML=h}function render(){renderList();renderCal();$('list').classList.toggle('hidden',view!=='list');$('cal').classList.toggle('hidden',view!=='calendar')}document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('on',x===b));render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x===b));render()});$('month').oninput=render;$('q').oninput=render;$('jump').onchange=()=>{if(!$('jump').value)return;$('month').value=$('jump').value.slice(0,7);view='list';document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x.dataset.view==='list'));render();setTimeout(()=>document.getElementById('d-'+$('jump').value)?.scrollIntoView({behavior:'smooth'}),50)};render();</script></body></html>
