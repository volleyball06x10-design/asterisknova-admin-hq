<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTERISKNOVA 練習・大会日程</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.w{max-width:1000px;margin:auto;padding:16px}header{background:#102a56;color:#fff;padding:20px;border-radius:18px}h1{font-size:23px;margin:4px 0}.card,.day{background:#fff;border-radius:14px;margin:12px 0;padding:13px}.ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}input,textarea,button{font:inherit;padding:10px;border:1px solid #d7dce5;border-radius:9px;width:100%}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tabs button{width:auto;font-weight:800}.on,.save{background:#102a56!important;color:#fff}.event{border-top:1px solid #eee;padding:12px 0;display:grid;grid-template-columns:80px 1fr;gap:9px}.badge{font-size:12px;font-weight:900}.practice{color:#067647}.tournament{color:#b54708}.meta,.note,.sync{font-size:12px;color:#667085}.level{font-weight:900}.memo{grid-column:1/3;background:#f8fafc;padding:10px;border-radius:10px}.memoGrid{display:grid;grid-template-columns:1fr 2fr auto;gap:7px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cell{background:#fff;border:1px solid #e5e9f0;border-radius:9px;min-height:95px;padding:6px}.dot{font-size:10px;display:block;margin-top:4px}.past{opacity:.58}.hidden{display:none}.back{color:#fff}.empty{padding:25px;text-align:center;color:#667085}@media(max-width:650px){.ctrl,.memoGrid{grid-template-columns:1fr}.event{grid-template-columns:65px 1fr}.memo{grid-column:1/3}.cell{min-height:72px;padding:4px}.dot{font-size:8px}}</style></head><body><div class="w"><header><small>合同会社ASTERISKNOVA</small><h1>🏐 練習・大会 日程表</h1><div class="sync" id="sync">共通日程を読み込み中…</div><a class="back" href="/">← 管理本部へ戻る</a></header><section class="card"><div class="ctrl"><label>月<input id="month" type="month"></label><label>日付ジャンプ<input id="jump" type="date"></label><label>検索<input id="q" placeholder="場所・レベル・団体カード・メモ"></label></div><div class="tabs"><button class="on" data-type="all">全部</button><button data-type="practice">練習</button><button data-type="tournament">大会</button></div><div class="tabs"><button class="on" data-view="list">☰ 今後の一覧</button><button data-view="calendar">📅 カレンダー（過去含む）</button></div></section><div id="list"></div><div id="cal" class="hidden"></div></div><script>const EAPI='https://ymppbgyjulrkvjtlfval.supabase.co/functions/v1/admin-hq-schedule-events',NAPI='https://ymppbgyjulrkvjtlfval.supabase.co/functions/v1/admin-hq-schedule-notes';let E=[],notes={},type='all',view='list';const $=x=>document.getElementById(x),K=()=>sessionStorage.getItem('admin_hq_key')||'',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'}),ek=x=>[x.event_date,x.event_type,x.venue,x.event_time,x.level].join('|');function ended(x){if(x.event_date<today())return true;if(x.event_date>today())return false;const m=x.event_time.match(/(?:–|-|〜|~)(\d{1,2}):(\d{2})/);if(!m)return false;const now=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));return now.getHours()*60+now.getMinutes()>=Number(m[1])*60+Number(m[2])}async function get(url){const r=await fetch(url,{headers:{'x-admin-key':K()}});if(r.status===401)throw Error('AUTH');if(!r.ok)throw Error('通信エラー');return r.json()}async function load(){if(!K()){$('sync').textContent='管理本部にログインしてから開いてください';return}try{const[a,b]=await Promise.all([get(EAPI),get(NAPI)]);E=(a.data||[]).filter(x=>!x.is_hidden);notes={};(b.data||[]).forEach(n=>notes[n.event_key]=n);$('sync').textContent='✓ 日程・団体カード・メモ 共通保存：接続済み';render()}catch(e){$('sync').textContent=e.message==='AUTH'?'管理本部にログインしてから開いてください':'日程を読み込めませんでした'}}function filtered(all=false){let a=E.filter(x=>x.event_date.startsWith($('month').value)&&(type==='all'||x.event_type===type));if(!all)a=a.filter(x=>!ended(x));const q=$('q').value.trim().toLowerCase();return a.filter(x=>!q||([x.venue,x.level,x.fee,x.note,notes[ek(x)]?.organization_card,notes[ek(x)]?.memo].join(' ').toLowerCase().includes(q)))}async function saveNote(x){const id=CSS.escape(ek(x)),card=document.querySelector(`[data-card="${id}"]`).value.trim(),memo=document.querySelector(`[data-memo="${id}"]`).value.trim();const r=await fetch(NAPI,{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':K()},body:JSON.stringify({event_key:ek(x),event_date:x.event_date,venue:x.venue,event_time:x.event_time,organization_card:card,memo})});if(!r.ok)return alert('保存できませんでした');notes[ek(x)]={organization_card:card,memo};alert('保存しました')}function renderList(){const a=filtered(),g={};a.forEach(x=>(g[x.event_date]??=[]).push(x));$('list').innerHTML=Object.entries(g).map(([d,v])=>`<section class="day"><h3>${d}</h3>${v.map(x=>{const n=notes[ek(x)]||{},id=esc(ek(x));return `<div class="event"><div class="badge ${x.event_type}">${x.event_type==='practice'?'🏐 練習':'✡️ 大会'}</div><div><b>${esc(x.venue)}</b><div>${esc(x.event_time)}　<span class="level">${esc(x.level)}</span>${x.fee?'　'+esc(x.fee):''}</div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}</div><div class="memo"><div class="memoGrid"><input data-card="${id}" placeholder="団体カード（後で追記OK）" value="${esc(n.organization_card)}"><textarea data-memo="${id}" placeholder="メモ">${esc(n.memo)}</textarea><button class="save" onclick='saveById(${x.id})'>保存</button></div></div></div>`}).join('')}</section>`}).join('')||'<div class="empty">該当する今後の日程はありません。</div>'}function saveById(id){const x=E.find(v=>v.id==id);if(x)saveNote(x)}function renderCal(){const a=filtered(true),m=$('month').value,[y,mo]=m.split('-').map(Number),first=new Date(y,mo-1,1),last=new Date(y,mo,0).getDate();let h='<div class="calendar">'+['日','月','火','水','木','金','土'].map(x=>`<b>${x}</b>`).join('');for(let i=0;i<first.getDay();i++)h+='<div></div>';for(let d=1;d<=last;d++){const ds=m+'-'+String(d).padStart(2,'0'),v=a.filter(x=>x.event_date===ds);h+=`<div class="cell ${ds<today()?'past':''}"><b>${d}</b>${v.map(x=>`<span class="dot">${x.event_type==='practice'?'🏐':'✡️'} ${esc(x.venue)} ${notes[ek(x)]?.organization_card?'🪪':''}</span>`).join('')}</div>`}h+='</div>';$('cal').innerHTML=h}function render(){renderList();renderCal();$('list').classList.toggle('hidden',view!=='list');$('cal').classList.toggle('hidden',view!=='calendar')}document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('on',x===b));render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x===b));render()});$('month').value=today().slice(0,7);$('month').onchange=render;$('q').oninput=render;$('jump').onchange=e=>{if(!e.target.value)return;$('month').value=e.target.value.slice(0,7);view='calendar';document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x.dataset.view==='calendar'));render()};load();</script></body></html>
