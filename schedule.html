const API='https://ymppbgyjulrkvjtlfval.supabase.co/functions/v1/admin-hq-schedule-notes';let notes={},type='all',view='list';const $=id=>document.getElementById(id),key=x=>[x[0],x[1],x[2],x[3],x[4]].join('|'),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function filt(all=false){let a=E.filter(x=>x[0].startsWith($('month').value)&&(type==='all'||x[1]===type));if(!all)a=a.filter(x=>x[0]>=today());const q=$('q').value.trim().toLowerCase();return a.filter(x=>!q||(x.join(' ')+' '+(notes[key(x)]?.organization_card||'')+' '+(notes[key(x)]?.memo||'')).toLowerCase().includes(q))}async function load(){const k=sessionStorage.getItem('admin_hq_key');if(!k){$('sync').textContent='管理本部にログインすると団体カード・メモを共通保存できます';render();return}try{const r=await fetch(API,{headers:{'x-admin-key':k}});if(!r.ok)throw 0;const j=await r.json();notes={};(j.data||[]).forEach(n=>notes[n.event_key]=n);$('sync').textContent='✓ 団体カード・メモ：PC/スマホ同期中';render()}catch(e){$('sync').textContent='メモ同期に接続できません。管理本部から開き直してください';render()}}async function save(i){const x=E[i],k=sessionStorage.getItem('admin_hq_key');if(!k)return alert('先に管理本部へログインしてください');const card=$('card-'+i).value.trim(),memo=$('memo-'+i).value.trim(),b=$('save-'+i);b.disabled=true;b.textContent='保存中…';try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-admin-key':k},body:JSON.stringify({event_key:key(x),event_date:x[0],venue:x[2],event_time:x[3],organization_card:card,memo})});if(!r.ok)throw 0;notes[key(x)]=(await r.json()).data;b.textContent='✓ 保存済み'}catch(e){b.textContent='保存失敗';alert('保存できませんでした')}finally{b.disabled=false;setTimeout(()=>b.textContent='保存',1200)}}function eventHtml(x){const i=E.indexOf(x),n=notes[key(x)]||{};return `<div class="event"><div class="badge ${x[1]}">${x[1]==='practice'?'練習':'大会'
