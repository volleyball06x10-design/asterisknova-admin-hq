<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTERISKNOVA 日程一覧</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}header{background:#102a56;color:#fff;padding:20px;border-radius:18px;margin-bottom:14px}h1{font-size:22px;margin:0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#fff;padding:14px;border-radius:14px;margin-bottom:12px}select,button{width:100%;padding:11px;border:1px solid #d7dce5;border-radius:10px;font:inherit}.tabs{display:flex;gap:7px;grid-column:1/-1}.tabs button{background:#eef2f7;color:#344054;font-weight:700}.tabs button.on{background:#102a56;color:#fff}.day{background:#fff;border-radius:14px;margin-bottom:10px;overflow:hidden;border:1px solid #e6eaf0}.day summary{cursor:pointer;padding:14px;font-weight:800;list-style:none}.day summary::-webkit-details-marker{display:none}.day summary:before{content:'▶';font-size:11px;margin-right:8px}.day[open] summary:before{content:'▼'}.event{border-top:1px solid #edf0f4;padding:13px 15px;display:grid;grid-template-columns:82px 1fr auto;gap:10px;align-items:center}.type{font-size:12px;font-weight:800;border-radius:99px;padding:5px 8px;text-align:center;background:#eef2ff}.practice{background:#ecfdf3}.tournament{background:#fff7ed}.time{font-size:12px;color:#667085;margin-top:3px}.level{font-weight:800}.empty{background:#fff;padding:20px;border-radius:14px;color:#667085}@media(max-width:600px){.controls{grid-template-columns:1fr}.tabs{grid-column:auto}.event{grid-template-columns:76px 1fr}.level{grid-column:2}}</style></head><body><div class="wrap"><header><small>合同会社ASTERISKNOVA</small><h1>🏐 練習・大会 日程一覧</h1></header><div class="controls"><select id="month"><option value="2026-09">2026年9月</option><option value="2026-10">2026年10月</option></select><div class="tabs"><button class="on" data-type="all">全部</button><button data-type="practice">練習</button><button data-type="tournament">大会</button></div></div><div id="list"></div></div><script>const events=[['2026-09-16','practice','馬込文化センター','19:00–22:00','⭐🌺'],['2026-09-16','practice','王子特別支援','18:00–21:00','🌸'],['2026-09-16','practice','北沢中','18:30–21:00','🌺🌸'],['2026-09-17','practice','馬込文化センター','19:00–22:00','⭐🌺'],['2026-09-17','practice','北特別支援','18:00–21:00','🌸'],['2026-09-17','practice','北の台','18:00–21:00','🌸💎'],['2026-09-18','practice','王子特別支援','18:00–21:00','🌸'],['2026-09-18','practice','武蔵丘','18:30–21:00','🌺🌸'],['2026-09-19','practice','練馬特別支援','15:00–18:00','🌸'],['2026-09-19','tournament','清瀬ひまわり','13:00–17:00','混合DE'],['2026-09-19','practice','西荻','17:00–21:00','⭐'],['2026-09-19','practice','杉並四宮','18:00–21:00','🌺'],['2026-09-20','tournament','清瀬','13:00–17:00','男子'],['2026-09-20','practice','西荻','17:00–21:00','🌺🌸'],['2026-09-20','tournament','光明学園','12:00–18:00','🌠 個人参加大会'],['2026-09-22','tournament','北区教育総合','9:00–18:00','混合D'],['2026-09-26','tournament','世田谷総合','9:00–15:00','男子'],['2026-09-26','tournament','世田谷総合','15:00–21:00','混合E'],['2026-09-26','tournament','春日部サブ','9:00–15:30','混合C'],['2026-09-26','tournament','春日部サブ','15:30–21:30','混合D'],['2026-09-27','tournament','清瀬ひまわり','9:00–17:00','混合CD'],['2026-10-04','tournament','北区桐ケ丘','9:00–15:00','DE'],['2026-10-10','tournament','世田谷総合','午前','CD'],['2026-10-10','tournament','世田谷総合','午後','D'],['2026-10-12','tournament','神奈川県立スポーツセンター','18:00–21:00','C'],['2026-10-12','tournament','神奈川県立スポーツセンター','18:00–21:00','D'],['2026-10-18','tournament','蓮田総合','12:00–21:00','混合CD']];let type='all';const list=document.getElementById('list'),month=document.getElementById('month');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const a=events.filter(x=>x[0].startsWith(month.value)&&(type==='all'||x[1]===type));const g={};a.forEach(x=>(g[x[0]]??=[]).push(x));list.innerHTML=a.length?Object.entries(g).map(([d,v])=>`<details class="day" open><summary>${Number(d.slice(5,7))}/${Number(d.slice(8,10))}　${v.length}件</summary>${v.map(x=>`<div class="event"><span class="type ${x[1]}">${x[1]==='practice'?'練習':'大会'}</span><div><b>${esc(x[2])}</b><div class="time">${esc(x[3])}</div></div><div class="level">${esc(x[4])}</div></div>`).join('')}</details>`).join(''):'<div class="empty">この条件の日程はありません。</div>'}document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('on',x===b));render()}));month.addEventListener('change',render);render();</script></body></html>
