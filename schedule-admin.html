<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日程管理</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.w{max-width:900px;margin:auto;padding:16px}header,.card{border-radius:16px;padding:16px;margin-bottom:13px}header{background:#102a56;color:#fff}.card{background:#fff}.g{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,select,textarea,button{width:100%;padding:11px;border:1px solid #d7dce5;border-radius:9px;font:inherit}textarea{min-height:65px}.bulk{min-height:190px}.full{grid-column:1/-1}.primary{background:#102a56;color:#fff;font-weight:800}.item{padding:12px 0;border-top:1px solid #eee}.actions{display:flex;gap:6px;margin-top:8px}.actions button{width:auto}.danger{background:#fff0f0;color:#b42318}.muted{font-size:12px;color:#667085}.back{color:#fff}@media(max-width:600px){.g{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="w"><header><small>ASTERISKNOVA 管理本部</small><h1>🗓️ 日程追加・編集</h1><div>日程・参加費・体育館代をまとめて管理。団体カードは後から追記できます。</div><a class="back" href="/">← 管理本部へ</a></header><section class="card"><h2>📝 メモから一括追加</h2><p class="muted">LINEの日程メモをそのまま貼り付け。日付・時間・レベル・参加費を読み取ります。</p><textarea id="bulk" class="bulk"></textarea><label>対象の年・月<input id="bulkMonth" type="month"></label><button class="primary" style="margin-top:10px" onclick="bulkAdd()">メモを解析して一括登録</button><div id="bulkMsg" class="muted"></div></section><section class="card"><details><summary><b>1件ずつ追加・修正</b></summary><div class="g" style="margin-top:12px"><label>日付<input id="date" type="date"></label><label>種類<select id="type"><option value="practice">練習</option><option value="tournament">大会</option></select></label><label>体育館・会場<input id="venue"></label><label>時間<input id="time"></label><label>レベル<input id="level"></label><label>基本参加費<input id="fee" type="number" min="0" placeholder="400"></label><label>体育館代<input id="venueCost" type="number" min="0" placeholder="0"></label><label>団体カード（後からでOK）<input id="cardNote"></label><label class="full">備考<textarea id="note"></textarea></label><div class="full"><button class="primary" id="save" onclick="save()">日程を登録</button><button id="cancel" style="display:none;margin-top:7px" onclick="reset()">修正をキャンセル</button></div></div></details></section><section class="card"><h2>登録した日程</h2><div id="list">読み込み中…</div></section></div><script>const API='https://ymppbgyjulrkvjtlfval.supabase.co/functions/v1/admin-hq-schedule-events',K=()=>sessionStorage.getItem('admin_hq_key')||'',today=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});let A=[],edit=null;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function req(method='GET',body){const r=await fetch(API,{method,headers:{'Content-Type':'application/json','x-admin-key':K()},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'通信エラー');return j}async function load(){try{A=(await req()).data||[];render()}catch(e){$('list').textContent=e.message}}function p(){const f=Number($('fee').value||0);return{event_date:$('date').value,event_type:$('type').value,venue:$('venue').value.trim(),event_time:$('time').value.trim(),level:$('level').value.trim(),fee:f?f+'円':'',default_fee:f,venue_cost:Number($('venueCost').value||0),card_note:$('cardNote').value.trim(),note:$('note').value.trim(),is_hidden:false}}async function save(){const x=p();if(!x.event_date||!x.venue||!x.event_time)return alert('日付・会場・時間を入力してください');await req(edit?'PUT':'POST',edit?{id:edit,...x}:x);reset();await load()}function parseLine(line,ym){let s=line.trim(),dm=s.match(/(\d{1,2})日(?:\([^)]*\))?/),tm=s.match(/(\d{1,2}:\d{2})\s*[-−–〜~]\s*(\d{1,2}:\d{2})/);if(!dm||!tm)return null;const date=ym+'-'+String(+dm[1]).padStart(2,'0'),time=tm[1]+'–'+tm[2],event_type=/✡️|🌠|大会/.test(s)?'tournament':'practice';let rest=s.slice((tm.index||0)+tm[0].length).trim(),level=(rest.match(/^(?:⭐️?|🌺|🌸|💎|🏐|🚹️?)+/)||[''])[0];if(level)rest=rest.slice(level.length).trim();const fm=s.match(/参加費\s*(\d{3,5})円/),default_fee=fm?+fm[1]:0;let venue=rest.replace(/※.+/,'').replace(/参加費\s*\d+円/g,'').trim();if(!venue)return null;return{event_date:date,event_type,venue,event_time:time,level,fee:default_fee?default_fee+'円':'',default_fee,venue_cost:0,card_note:'',note:[...s.matchAll(/※([^※]+)/g)].map(m=>m[1].trim()).join(' / '),is_hidden:false}}async function bulkAdd(){const ym=$('bulkMonth').value,a=$('bulk').value.split(/\r?\n/).map(x=>parseLine(x,ym)).filter(Boolean);if(!ym||!a.length)return alert('対象年月と日程メモを入力してください');if(!confirm(a.length+'件登録しますか？'))return;let ok=0;for(const x of a){try{await req('POST',x);ok++}catch{}}$('bulkMsg').textContent='✅ '+ok+'件登録しました';if(ok){$('bulk').value='';await load()}}function render(){const a=[...A].sort((x,y)=>(y.event_date+y.event_time).localeCompare(x.event_date+x.event_time));$('list').innerHTML=a.map(x=>`<div class="item"><b>${esc(x.event_date)}｜${x.event_type==='practice'?'練習':'大会'}｜${esc(x.venue)}</b><div>${esc(x.event_time)}　${esc(x.level)}　参加費 ${Number(x.default_fee||0).toLocaleString()}円</div><div class="muted">体育館代 ${Number(x.venue_cost||0).toLocaleString()}円${x.card_note?' ／ 🪪 '+esc(x.card_note):''}${x.note?' ／ '+esc(x.note):''}</div><div class="actions"><button onclick="start(${x.id})">修正</button><button class="danger" onclick="del(${x.id})">削除</button></div></div>`).join('')||'日程はありません'}function start(id){const x=A.find(v=>v.id==id);edit=id;$('date').value=x.event_date;$('type').value=x.event_type;$('venue').value=x.venue;$('time').value=x.event_time;$('level').value=x.level;$('fee').value=x.default_fee||0;$('venueCost').value=x.venue_cost||0;$('cardNote').value=x.card_note||'';$('note').value=x.note||'';$('save').textContent='修正内容を保存';$('cancel').style.display='block';scrollTo({top:0,behavior:'smooth'})}async function del(id){if(confirm('削除しますか？')){await req('DELETE',{id});await load()}}function reset(){edit=null;['venue','time','level','fee','venueCost','cardNote','note'].forEach(i=>$(i).value='');$('date').value=today();$('type').value='practice';$('save').textContent='日程を登録';$('cancel').style.display='none'}$('date').value=today();$('bulkMonth').value=today().slice(0,7);load();</script></body></html>
