<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTERISKNOVA 管理本部</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f5f7fb;color:#162033}header{background:#102a56;color:#fff;padding:22px 16px}header small{opacity:.8}header h1{margin:5px 0 0;font-size:25px}.wrap{max-width:980px;margin:auto;padding:16px}.notice{background:#eaf2ff;border:1px solid #c8dcff;padding:12px;border-radius:12px;margin-bottom:14px}.ok{background:#ecfdf3;border-color:#abefc6}.editnotice{background:#fff7e8;border:1px solid #fedf89;padding:10px;border-radius:10px;margin-bottom:10px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;border-radius:15px;padding:15px;box-shadow:0 2px 10px #102a5612;margin-bottom:14px}.stat b{display:block;font-size:21px;margin-top:6px}.stat span,label,.muted{font-size:12px;color:#667085}h2{font-size:18px;margin:2px 0 14px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,textarea{width:100%;margin-top:5px;padding:12px;border:1px solid #d7dce5;border-radius:10px;font:inherit}textarea{min-height:70px}.full{grid-column:1/-1}button,.link{border:0;border-radius:10px;padding:12px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#102a56;color:#fff;width:100%}.secondary{background:#eef2f7;color:#344054;width:100%;margin-top:8px}.primary:disabled{opacity:.55;cursor:wait}.links{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.link{background:#f1f5fb;color:#102a56}.item{border-top:1px solid #eee;padding:12px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.money{font-weight:800}.actions{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}.edit{background:#eaf2ff;color:#175cd3;padding:7px 10px}.del{background:#fff0f0;color:#b42318;padding:7px 10px}.login{max-width:430px;margin:60px auto}.hidden{display:none}.msg{margin-top:10px;font-size:13px;font-weight:700}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.form,.links{grid-template-columns:1fr}.full{grid-column:auto}.row{display:block}.actions{justify-content:flex-start}}</style></head><body><header><small>合同会社ASTERISKNOVA</small><h1>ASTERISKNOVA 管理本部</h1></header><main class="wrap"><section id="login" class="card login"><h2>🔐 管理本部ログイン</h2><label>管理者パスワード<input id="password" type="password" autocomplete="current-password"></label><button class="primary" style="margin-top:12px" onclick="login()">ログイン</button><div id="loginmsg" class="muted" style="margin-top:10px"></div></section><div id="app" class="hidden"><div id="sync" class="notice">☁️ 共通データを読み込み中…</div><section class="stats"><div class="card stat"><span>今月の売上</span><b id="sales">¥0</b></div><div class="card stat"><span>今月の経費</span><b id="cost">¥0</b></div><div class="card stat"><span>今月の利益</span><b id="profit">¥0</b></div><div class="card stat"><span>利益率</span><b id="margin">0%</b></div></section><section class="card"><h2 id="formTitle">🏆 大会売上・利益を登録</h2><div id="editNotice" class="editnotice hidden">✏️ 登録済み大会を修正中です</div><div class="form"><label>開催日<input id="date" type="date"></label><label>大会名・会場<input id="name" placeholder="例：混合D 永福体育館"></label><label>参加チーム数<input id="teams" type="number" min="0"></label><label>1チーム参加費<input id="fee" type="number" min="0"></label><label>体育館代<input id="venue" type="number" min="0"></label><label>その他経費<input id="other" type="number" min="0"></label><label class="full">メモ<textarea id="memo"></textarea></label><div class="full"><button id="saveBtn" class="primary" type="button" onclick="saveEvent()">大会結果を登録</button><button id="cancelBtn" class="secondary hidden" type="button" onclick="cancelEdit()">修正をキャンセル</button><div id="savemsg" class="msg"></div></div></div></section><section class="card"><h2>📋 登録済み大会</h2><div id="list" class="muted">読み込み中…</div></section><section class="card"><h2>⚙️ 各管理ページ</h2><div class="links"><a class="link" href="https://asterisk-practice-fees.volleyball06x10.chatgpt.site">💴 練習参加費管理</a><a class="link" href="https://asterisk-attendance-member.vercel.app">🏐 正規メンバー出欠</a><a class="link" href="https://asterisk-attendance-visitor.vercel.app">🌟 ビジター申請</a><a class="link" href="https://asterisk-attendance-admin.vercel.app">🛠️ 出欠管理</a><a class="link" href="https://asterisk-scoreboard.vercel.app">📊 試合・集計</a><a class="link" href="https://asterisk-coupon-admin.vercel.app">🎟️ クーポン管理</a><a class="link" href="https://asterisk-free-ticket.volleyball06x10.chatgpt.site/admin">🎫 参加無料チケット管理</a></div></section></div></main><script>const API='https://ymppbgyjulrkvjtlfval.supabase.co/functions/v1/admin-hq-finance';let rows=[],editingId=null;const $=id=>document.getElementById(id),yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP'),num=id=>Number($(id).value||0),key=()=>sessionStorage.getItem('admin_hq_key')||'',today=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});async function request(method='GET',body=null,url=API){const opt={method,headers:{'Content-Type':'application/json','x-admin-key':key()}};if(body!==null)opt.body=JSON.stringify(body);const r=await fetch(url,opt);let j={};try{j=await r.json()}catch(e){}if(r.status===401)throw new Error('AUTH');if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}async function login(){const p=$('password').value;if(!p)return;$('loginmsg').textContent='接続中…';sessionStorage.setItem('admin_hq_key',p);try{await loadRemote();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('password').value='';$('loginmsg').textContent=''}catch(e){sessionStorage.removeItem('admin_hq_key');$('loginmsg').textContent=e.message==='AUTH'?'パスワードが違います。':'接続できませんでした。'}}async function loadRemote(){const j=await request();rows=j.data||[];render();$('sync').textContent='☁️ PC・スマホ共通保存：接続済み';$('sync').classList.add('ok')}function payload(){return{event_date:$('date').value,event_name:$('name').value.trim(),teams:num('teams'),team_fee:num('fee'),venue_cost:num('venue'),other_cost:num('other'),memo:$('memo').value.trim()}}async function saveEvent(){const p=payload();if(!p.event_date||!p.event_name){alert('開催日と大会名・会場を入力してください');return}const btn=$('saveBtn');btn.disabled=true;btn.textContent=editingId?'更新中…':'保存中…';$('savemsg').textContent='';try{if(editingId){await request('PUT',{id:editingId,...p});$('savemsg').textContent='✅ 修正しました';}else{await request('POST',p);$('savemsg').textContent='✅ 登録しました';}resetForm();await loadRemote()}catch(e){console.error(e);$('savemsg').textContent='❌ 保存できませんでした：'+(e.message||'接続エラー')}finally{btn.disabled=false;btn.textContent='大会結果を登録'}}function editEvent(id){const x=rows.find(r=>Number(r.id)===Number(id));if(!x)return;editingId=Number(id);$('date').value=x.event_date;$('name').value=x.event_name;$('teams').value=x.teams;$('fee').value=x.team_fee;$('venue').value=x.venue_cost;$('other').value=x.other_cost;$('memo').value=x.memo||'';$('formTitle').textContent='✏️ 大会売上・利益を修正';$('editNotice').classList.remove('hidden');$('cancelBtn').classList.remove('hidden');$('saveBtn').textContent='修正内容を保存';$('savemsg').textContent='';window.scrollTo({top:0,behavior:'smooth'})}function resetForm(){editingId=null;['name','teams','fee','venue','other','memo'].forEach(id=>$(id).value='');$('date').value=today();$('formTitle').textContent='🏆 大会売上・利益を登録';$('editNotice').classList.add('hidden');$('cancelBtn').classList.add('hidden');$('saveBtn').textContent='大会結果を登録'}function cancelEdit(){resetForm();$('savemsg').textContent='修正をキャンセルしました'}async function del(id){if(!confirm('この大会データを削除しますか？'))return;try{await request('DELETE',null,API+'?id='+encodeURIComponent(id));if(editingId===Number(id))resetForm();await loadRemote()}catch(e){alert('削除できませんでした')}}function render(){const ym=today().slice(0,7);let s=0,c=0;for(const x of rows.filter(x=>String(x.event_date||'').slice(0,7)===ym)){s+=Number(x.teams||0)*Number(x.team_fee||0);c+=Number(x.venue_cost||0)+Number(x.other_cost||0)}$('sales').textContent=yen(s);$('cost').textContent=yen(c);$('profit').textContent=yen(s-c);$('margin').textContent=s?((s-c)/s*100).toFixed(1)+'%':'0%';const list=$('list');if(!rows.length){list.className='muted';list.textContent='まだ登録がありません。';return}list.className='';list.innerHTML=rows.map(x=>{const ss=Number(x.teams||0)*Number(x.team_fee||0),cc=Number(x.venue_cost||0)+Number(x.other_cost||0);return `<div class="item"><div class="row"><div><b>${esc(x.event_date)}｜${esc(x.event_name)}</b><div class="muted">${x.teams}チーム × ${yen(x.team_fee)} ／ 経費 ${yen(cc)}</div>${x.memo?`<div class="muted">${esc(x.memo)}</div>`:''}</div><div style="text-align:right"><div class="money">利益 ${yen(ss-cc)}</div><div class="actions"><button class="edit" onclick="editEvent(${Number(x.id)})">✏️ 修正</button><button class="del" onclick="del(${Number(x.id)})">削除</button></div></div></div></div>`}).join('')}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}$('date').value=today();if(key())login();</script></body></html>
