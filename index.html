<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTERISKNOVA 管理本部</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f5f7fb;color:#162033}header{background:#102a56;color:#fff;padding:22px 16px}header small{opacity:.8}header h1{margin:5px 0 0;font-size:25px}.wrap{max-width:980px;margin:auto;padding:16px}.notice{background:#eaf2ff;border:1px solid #c8dcff;padding:12px;border-radius:12px;margin-bottom:14px}.stats,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;border-radius:15px;padding:15px;box-shadow:0 2px 10px #102a5612;margin-bottom:14px}.stat b{display:block;font-size:21px;margin-top:6px}.stat span{font-size:12px;color:#667085}h2{font-size:18px;margin:2px 0 14px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{font-size:12px;color:#667085}input,textarea{width:100%;margin-top:5px;padding:12px;border:1px solid #d7dce5;border-radius:10px;font:inherit}textarea{min-height:70px}.full{grid-column:1/-1}button,.link{border:0;border-radius:10px;padding:12px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#102a56;color:#fff;width:100%}.links{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.link{background:#f1f5fb;color:#102a56}.item{border-top:1px solid #eee;padding:12px 0}.item:first-child{border-top:0}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.money{font-weight:800}.del{background:#fff0f0;color:#b42318;padding:7px 10px}.muted{color:#667085;font-size:12px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.grid,.form,.links{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><small>合同会社ASTERISKNOVA</small><h1>ASTERISKNOVA 管理本部</h1></header><main class="wrap"><div class="notice">🛠️ 第2版｜大会売上・経費・利益の登録と月間自動集計に対応</div><section class="stats"><div class="card stat"><span>今月の売上</span><b id="sales">¥0</b></div><div class="card stat"><span>今月の経費</span><b id="cost">¥0</b></div><div class="card stat"><span>今月の利益</span><b id="profit">¥0</b></div><div class="card stat"><span>利益率</span><b id="margin">0%</b></div></section><section class="card"><h2>🏆 大会売上・利益を登録</h2><div class="form"><div><label>開催日<input id="date" type="date"></label></div><div><label>大会名・会場<input id="name" placeholder="例：混合D 永福体育館"></label></div><div><label>参加チーム数<input id="teams" type="number" min="0" inputmode="numeric"></label></div><div><label>1チーム参加費<input id="fee" type="number" min="0" inputmode="numeric"></label></div><div><label>体育館代<input id="venue" type="number" min="0" inputmode="numeric"></label></div><div><label>その他経費<input id="other" type="number" min="0" inputmode="numeric"></label></div><div class="full"><label>メモ<textarea id="memo"></textarea></label></div><div class="full"><button class="primary" onclick="addEvent()">大会結果を登録</button></div></div></section><section class="card"><h2>📋 登録済み大会</h2><div id="list" class="muted">まだ登録がありません。</div></section><section class="card"><h2>⚙️ 各管理ページ</h2><div class="links"><a class="link" href="https://asterisk-practice-fees.volleyball06x10.chatgpt.site">💴 練習参加費管理</a><a class="link" href="https://asterisk-attendance-member.vercel.app">🏐 正規メンバー出欠</a><a class="link" href="https://asterisk-attendance-visitor.vercel.app">🌟 ビジター申請</a><a class="link" href="https://asterisk-attendance-admin.vercel.app">🛠️ 出欠管理</a><a class="link" href="https://asterisk-scoreboard.vercel.app">📊 試合・集計</a><a class="link" href="https://asterisk-coupon-admin.vercel.app">🎟️ クーポン管理</a><a class="link" href="https://asterisk-free-ticket.volleyball06x10.chatgpt.site/admin">🎫 参加無料チケット管理</a></div></section></main><script>const KEY='asterisknova_tournament_finance_v2';const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');const num=id=>Number(document.getElementById(id).value||0);function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function save(x){localStorage.setItem(KEY,JSON.stringify(x))}function addEvent(){const date=document.getElementById('date').value,name=document.getElementById('name').value.trim();if(!date||!name){alert('開催日と大会名・会場を入力してください');return}const a=load();a.unshift({id:Date.now(),date,name,teams:num('teams'),fee:num('fee'),venue:num('venue'),other:num('other'),memo:document.getElementById('memo').value.trim()});save(a);['name','teams','fee','venue','other','memo'].forEach(x=>document.getElementById(x).value='');render()}function del(id){if(!confirm('この大会データを削除しますか？'))return;save(load().filter(x=>x.id!==id));render()}function render(){const a=load(),ym=new Date().toISOString().slice(0,7);let s=0,c=0;for(const x of a.filter(x=>x.date.slice(0,7)===ym)){s+=x.teams*x.fee;c+=x.venue+x.other}document.getElementById('sales').textContent=yen(s);document.getElementById('cost').textContent=yen(c);document.getElementById('profit').textContent=yen(s-c);document.getElementById('margin').textContent=s?((s-c)/s*100).toFixed(1)+'%':'0%';const list=document.getElementById('list');if(!a.length){list.className='muted';list.textContent='まだ登録がありません。';return}list.className='';list.innerHTML=a.map(x=>{const sales=x.teams*x.fee,cost=x.venue+x.other,p=sales-cost;return `<div class="item"><div class="row"><div><b>${esc(x.date)}｜${esc(x.name)}</b><div class="muted">${x.teams}チーム × ${yen(x.fee)} ／ 経費 ${yen(cost)}</div>${x.memo?`<div class="muted">${esc(x.memo)}</div>`:''}</div><div style="text-align:right"><div class="money">利益 ${yen(p)}</div><button class="del" onclick="del(${x.id})">削除</button></div></div></div>`}).join('')}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}document.getElementById('date').value=new Date().toISOString().slice(0,10);render();</script></body></html>
