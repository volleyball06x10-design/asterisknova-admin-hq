<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTERISKNOVA 管理本部</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}header{background:#102a56;color:#fff;padding:22px 16px}header h1{margin:4px 0 0;font-size:24px}.wrap{max-width:1050px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #102a5612}.notice{background:#eef6ff;border:1px solid #c8dcff;border-radius:12px;padding:12px;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat span,label,.muted{font-size:12px;color:#667085}.stat b{display:block;font-size:21px;margin-top:5px}.practice{background:#f0fdf4}.form,.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}input,select,textarea{width:100%;padding:11px;margin-top:5px;border:1px solid #d7dce5;border-radius:10px;font:inherit}textarea{min-height:70px}button,.link{border:0;border-radius:10px;padding:11px 13px;font-weight:700;text-decoration:none;cursor:pointer}.primary{width:100%;background:#102a56;color:#fff}.secondary{background:#eef2f7;color:#344054}.danger{background:#fff0f0;color:#b42318}.links{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.link{background:#f1f5fb;color:#102a56}.item{padding:12px 0;border-top:1px solid #eee}.row{display:flex;justify-content:space-between;gap:12px}.actions{display:flex;gap:6px;margin-top:8px}.summary{overflow:auto}.summary table{width:100%;min-width:720px;border-collapse:collapse}.summary th,.summary td{padding:9px;border-bottom:1px solid #eee;text-align:right;font-size:12px}.summary th:first-child,.summary td:first-child{text-align:left}.login{max-width:430px;margin:60px auto}.hidden{display:none}.ok{background:#ecfdf3;border-color:#abefc6}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.form,.filters,.links{grid-template-columns:1fr}.full{grid-column:auto}.row{display:block}}</style></head><body><header><small>合同会社ASTERISKNOVA</small><h1>ASTERISKNOVA 管理本部</h1></header><main class="wrap"><section id="login" class="card login"><h2>🔐 管理本部ログイン</h2><input id="password" type="password" placeholder="管理者パスワード"><button class="primary" style="margin-top:10px" onclick="login()">ログイン</button><p id="loginmsg" class="muted"></p></section><div id="app" class="hidden"><div id="sync" class="notice">☁️ 大会・練習データを読み込み中…</div><section class="stats"><div class="card stat"><span>今月の総売上</span><b id="totalSales">¥0</b></div><div class="card stat"><span>大会売上</span><b id="tSales">¥0</b></div><div class="card stat practice"><span>練習売上（入金済）</span><b id="pSales">¥0</b></div><div class="card stat practice"><span>練習未払い</span><b id="pUnpaid">¥0</b></div></section><section class="stats"><div class="card stat"><span>登録経費（大会）</span><b id="cost">¥0</b></div><div class="card stat"><span>差引</span><b id="balance">¥0</b></div><div class="card stat practice"><span>練習参加人数</span><b id="people">0人</b></div><div class="card stat practice"><span>有料 / 無料</span><b id="kinds">0 / 0</b></div></section><section class="card"><h2>📅 月別・年間集計</h2><div class="filters"><label>年<select id="year" onchange="renderSummary()"></select></label><label>大会一覧の月<select id="month" onchange="renderTournaments()"><option value="all">すべて</option></select></label></div><div class="summary"><table><thead><tr><th>月</th><th>大会売上</th><th>練習売上</th><th>総売上</th><th>大会経費</th><th>差引</th><th>練習人数</th></tr></thead><tbody id="summaryBody"></tbody></table></div></section><section class="card"><h2 id="formTitle">🏆 大会売上・利益を登録</h2><div class="form"><label>開催日<input id="date" type="date"></label><label>大会名・会場<input id="name"></label><label>参加チーム数<input id="teams" type="number" min="0"></label><label>1チーム参加費<input id="fee" type="number" min="0"></label><label>体育館代<input id="venue" type="number" min="0"></label><label>その他経費<input id="other" type="number" min="0"></label><label class="full">メモ<textarea id="memo"></textarea></label><div class="full"><button id="save" class="primary" onclick="saveTournament()">大会結果を登録</button><button id="cancel" class="secondary hidden" style="width:100%;margin-top:8px" onclick="resetForm()">修正をキャンセル</button><p id="msg" class="muted"></p></div></div></section><section class="card"><h2>🏐 今月の練習参加費</h2><div id="practiceList"></div></section><section class="card"><h2>📋 登録済み大会</h2><div id="tournamentList"></div></section><section class="card"><h2>⚙️ 各管理ページ</h2><div class="links"><a class="link" href="https://asterisk-practice-fees.vercel.app">💴 練習参加費管理</a><a class="link" href="https://asterisk-attendance-member.vercel.app">🏐 正規メンバー出欠</a><a class="link" href="https://asterisk-attendance-visitor.vercel.app">🌟 ビジター申請</a><a class="link" href="https://asterisk-attendance-admin.vercel.app">🛠️ 出欠管理</a><a class="link" href="https://asterisk-scoreboard.vercel.app">📊 試合・集計</a><a class="link" href="https://asterisk-coupon-admin.vercel.app">🎟️ クーポン管理</a><a class="link" href="https://asterisk-free-ticket.volleyball06x10.chatgpt.site/admin">🎫 参加無料チケット管理</a></div></section></div></main><script>const TAPI='https://ymppbgyjulrkvjtlfval.supabase.co/functions/v1/admin-hq-finance',PAPI='https://ymppbgyjulrkvjtlfval.supabase.co/functions/v1/admin-hq-practice-finance';let tr=[],pr=[],editId=null;const $=x=>document.getElementById(x),yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP'),num=x=>Number($(x).value||0),today=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'}),key=()=>sessionStorage.getItem('admin_hq_key')||'',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function req(url,method='GET',body){const o={method,headers:{'Content-Type':'application/json','x-admin-key':key()}};if(body!==undefined)o.body=JSON.stringify(body);const r=await fetch(url,o);let j={};try{j=await r.json()}catch{}if(r.status===401)throw Error('AUTH');if(!r.ok)throw Error(j.error||'通信エラー');return j}async function login(){sessionStorage.setItem('admin_hq_key',$('password').value);$('loginmsg').textContent='接続中…';try{await load();$('login').classList.add('hidden');$('app').classList.remove('hidden')}catch(e){sessionStorage.removeItem('admin_hq_key');$('loginmsg').textContent=e.message==='AUTH'?'パスワードが違います':'接続できませんでした'}}async function load(){const [a,b]=await Promise.all([req(TAPI),req(PAPI)]);tr=a.data||[];pr=b.data||[];filters();render();$('sync').textContent='☁️ 大会・練習データ 共通保存：接続済み';$('sync').classList.add('ok')}function tc(a){let s=0,c=0;a.forEach(x=>{s+=Number(x.teams||0)*Number(x.team_fee||0);c+=Number(x.venue_cost||0)+Number(x.other_cost||0)});return{s,c}}function pc(a){let s=0,u=0,f=0;a.forEach(x=>{if(x.free_reason)f++;else if(x.is_paid)s+=Number(x.actual_fee||0);else u+=Number(x.actual_fee||0)});return{s,u,f,n:a.length}}function filters(){const cy=today().slice(0,4),ys=[...new Set(tr.concat(pr).map(x=>String(x.event_date).slice(0,4)).filter(Boolean).concat(cy))].sort().reverse(),oy=$('year').value;$('year').innerHTML=ys.map(y=>`<option>${y}</option>`).join('');$('year').value=ys.includes(oy)?oy:cy;const ms=[...new Set(tr.map(x=>String(x.event_date).slice(0,7)).filter(Boolean))].sort().reverse(),om=$('month').value;$('month').innerHTML='<option value="all">すべて</option>'+ms.map(m=>`<option value="${m}">${m}</option>`).join('');$('month').value=ms.includes(om)?om:'all'}function render(){const ym=today().slice(0,7),t=tc(tr.filter(x=>String(x.event_date).startsWith(ym))),p=pc(pr.filter(x=>String(x.event_date).startsWith(ym)));$('tSales').textContent=yen(t.s);$('pSales').textContent=yen(p.s);$('totalSales').textContent=yen(t.s+p.s);$('pUnpaid').textContent=yen(p.u);$('cost').textContent=yen(t.c);$('balance').textContent=yen(t.s+p.s-t.c);$('people').textContent=p.n+'人';$('kinds').textContent=(p.n-p.f)+' / '+p.f;renderSummary();renderPractice();renderTournaments()}function renderSummary(){const y=$('year').value||today().slice(0,4);let h='';for(let m=1;m<=12;m++){const ym=y+'-'+String(m).padStart(2,'0'),t=tc(tr.filter(x=>String(x.event_date).startsWith(ym))),p=pc(pr.filter(x=>String(x.event_date).startsWith(ym)));h+=`<tr><td>${m}月</td><td>${yen(t.s)}</td><td>${yen(p.s)}</td><td><b>${yen(t.s+p.s)}</b></td><td>${yen(t.c)}</td><td>${yen(t.s+p.s-t.c)}</td><td>${p.n}人</td></tr>`}$('summaryBody').innerHTML=h}function renderPractice(){const ym=today().slice(0,7),a=pr.filter(x=>String(x.event_date).startsWith(ym));if(!a.length){$('practiceList').innerHTML='<p class="muted">今月の登録はまだありません。</p>';return}const groups={};a.forEach(x=>{const k=x.event_date+'|'+x.venue;(groups[k]??=[]).push(x)});$('practiceList').innerHTML=Object.entries(groups).map(([k,v])=>{const p=pc(v),[d,venue]=k.split('|');return `<div class="item"><b>${esc(d)}｜${esc(venue)}</b><div class="muted">${p.n}人（有料 ${p.n-p.f} / 無料 ${p.f}）</div><div>入金済 <b>${yen(p.s)}</b> ／ 未払い <b>${yen(p.u)}</b></div></div>`}).join('')}function renderTournaments(){const m=$('month').value,a=m==='all'?tr:tr.filter(x=>String(x.event_date).startsWith(m));$('tournamentList').innerHTML=a.length?a.map(x=>{const t=tc([x]);return `<div class="item"><div class="row"><div><b>${esc(x.event_date)}｜${esc(x.event_name)}</b><div class="muted">${x.teams}チーム × ${yen(x.team_fee)} ／ 経費 ${yen(t.c)}</div></div><div><b>差引 ${yen(t.s-t.c)}</b><div class="actions"><button class="secondary" onclick="editTournament(${x.id})">修正</button><button class="danger" onclick="delTournament(${x.id})">削除</button></div></div></div></div>`}).join(''):'<p class="muted">該当する大会はありません。</p>'}function payload(){return{event_date:$('date').value,event_name:$('name').value.trim(),teams:num('teams'),team_fee:num('fee'),venue_cost:num('venue'),other_cost:num('other'),memo:$('memo').value.trim()}}async function saveTournament(){const p=payload();if(!p.event_date||!p.event_name)return alert('開催日と大会名・会場を入力してください');$('save').disabled=true;try{await req(TAPI,editId?'PUT':'POST',editId?{id:editId,...p}:p);$('msg').textContent=editId?'✅ 修正しました':'✅ 登録しました';resetForm();await load()}catch(e){$('msg').textContent='❌ 保存できません：'+e.message}finally{$('save').disabled=false}}function editTournament(id){const x=tr.find(r=>Number(r.id)===Number(id));if(!x)return;editId=Number(id);$('date').value=x.event_date;$('name').value=x.event_name;$('teams').value=x.teams;$('fee').value=x.team_fee;$('venue').value=x.venue_cost;$('other').value=x.other_cost;$('memo').value=x.memo||'';$('formTitle').textContent='✏️ 大会売上・利益を修正';$('save').textContent='修正内容を保存';$('cancel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}async function delTournament(id){if(!confirm('この大会データを削除しますか？'))return;try{await req(TAPI,'DELETE',{id});await load()}catch(e){alert('削除できませんでした')}}function resetForm(){editId=null;['name','teams','fee','venue','other','memo'].forEach(x=>$(x).value='');$('date').value=today();$('formTitle').textContent='🏆 大会売上・利益を登録';$('save').textContent='大会結果を登録';$('cancel').classList.add('hidden')}$('date').value=today();if(sessionStorage.getItem('admin_hq_key'))login();</script></body></html>
