<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTERISKNOVA 管理本部</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f5f7fb;color:#162033}header{background:#102a56;color:#fff;padding:22px 16px}header small{opacity:.8}header h1{margin:5px 0 0;font-size:25px}.wrap{max-width:980px;margin:auto;padding:16px}.notice{background:#eaf2ff;border:1px solid #c8dcff;padding:12px;border-radius:12px;margin-bottom:14px}.ok{background:#ecfdf3;border-color:#abefc6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;border-radius:15px;padding:15px;box-shadow:0 2px 10px #102a5612;margin-bottom:14px}.stat b{display:block;font-size:21px;margin-top:6px}.stat span,label,.muted{font-size:12px;color:#667085}h2{font-size:18px;margin:2px 0 14px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,textarea{width:100%;margin-top:5px;padding:12px;border:1px solid #d7dce5;border-radius:10px;font:inherit}textarea{min-height:70px}.full{grid-column:1/-1}button,.link{border:0;border-radius:10px;padding:12px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#102a56;color:#fff;width:100%}.links{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.link{background:#f1f5fb;color:#102a56}.item{border-top:1px solid #eee;padding:12px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.money{font-weight:800}.del{background:#fff0f0;color:#b42318;padding:7px 10px}.login{max-width:430px;margin:60px auto}.hidden{display:none}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.form,.links{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><small>合同会社ASTERISKNOVA</small><h1>ASTERISKNOVA 管理本部</h1></header><main class="wrap"><section id="login" class="card login"><h2>🔐 管理本部ログイン</h2><label>管理者パスワード<input id="password" type="password" autocomplete="current-password"></label><button class="primary" style="margin-top:12px" onclick="login()">ログイン</button><div id="loginmsg" class="muted" style="margin-top:10px"></div></section><div id="app" class="hidden"><div id="sync" class="notice">☁️ 共通データを読み込み中…</div><section class="stats"><div class="card stat"><span>今月の売上</span><b id="sales">¥0</b></div><div class="card stat"><span>今月の経費</span><b id="cost">¥0</b></div><div class="card stat"><span>今月の利益</span><b id="profit">¥0</b></div><div class="card stat"><span>利益率</span><b id="margin">0%</b></div></section><section class="card"><h2>🏆 大会売上・利益を登録</h2><div class="form"><label>開催日<input id="date" type="date"></label><label>大会名・会場<input id="name" placeholder="例：混合D 永福体育館"></label><label>参加チーム数<input id="teams" type="number" min="0"></label><label>1チーム参加費<input id="fee" type="number" min="0"></label><label>体育館代<input id="venue" type="number" min="0"></label><label>その他経費<input id="other" type="number" min="0"></label><label class="full">メモ<textarea id="memo"></textarea></label><div class="full"><button class="primary" onclick="addEvent()">大会結果を登録</button></div></div></section><section class="card"><h2>📋 登録済み大会</h2><div id="list" class="muted">読み込み中…</div></section><section class="card"><h2>⚙️ 各管理ページ</h2><div class="links"><a class="link" href="https://asterisk-practice-fees.volleyball06x10.chatgpt.site">💴 練習参加費管理</a><a class="link" href="https://asterisk-attendance-member.vercel.app">🏐 正規メンバー出欠</a><a class="link" href="https://asterisk-attendance-visitor.vercel.app">🌟 ビジター申請</a><a class="link" href="https://asterisk-attendance-admin.vercel.app">🛠️ 出欠管理</a><a class="link" href="https://asterisk-scoreboard.vercel.app">📊 試合・集計</a><a class="link" href="https://asterisk-coupon-admin.vercel.app">🎟️ クーポン管理</a><a class="link" href="https://asterisk-free-ticket.volleyball06x10.chatgpt.site/admin">🎫 参加無料チケット管理</a></div></section></div></main><script>const API='https://ymppbgyjulrkvjtlfval.supabase.co/functions/v1/admin-hq-finance';let rows=[];const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP'),num=id=>Number(document.getElementById(id).value||0),key=()=>sessionStorage.getItem('admin_hq_key')||'';async function request(method='GET',body=null,url=API){const r=await fetch(url,{method,headers:{'Content-Type':'application/json','x-admin-key':key()},body:body?JSON.stringify(body):null});if(r.status===401)throw new Error('AUTH');if(!r.ok)throw new Error('API');return r.json()}async function login(){const p=document.getElementById('password').value;if(!p)return;sessionStorage.setItem('admin_hq_key',p);try{await loadRemote();document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('password').value='';}catch(e){sessionStorage.removeItem('admin_hq_key');document.getElementById('loginmsg').textContent=e.message==='AUTH'?'パスワードが違います。':'接続できませんでした。';}}async function loadRemote(){const j=await request();rows=j.data||[];render();document.getElementById('sync').textContent='☁️ PC・スマホ共通保存：接続済み';document.getElementById('sync').classList.add('ok')}async function addEvent(){const event_date=date.value,event_name=name.value.trim();if(!event_date||!event_name){alert('開催日と大会名・会場を入力してください');return}try{await request('POST',{event_date,event_name,teams:num('teams'),team_fee:num('fee'),venue_cost:num('venue'),other_cost:num('other'),memo:memo.value.trim()});['name','teams','fee','venue','other','memo'].forEach(x=>document.getElementById(x).value='');await loadRemote()}catch(e){alert('保存できませんでした')}}async function del(id){if(!confirm('この大会データを削除しますか？'))return;try{await request('DELETE',null,API+'?id='+encodeURIComponent(id));await loadRemote()}catch(e){alert('削除できませんでした')}}function render(){const ym=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'}).slice(0,7);let s=0,c=0;for(const x of rows.filter(x=>x.event_date.slice(0,7)===ym)){s+=x.teams*x.team_fee;c+=x.venue_cost+x.other_cost}sales.textContent=yen(s);cost.textContent=yen(c);profit.textContent=yen(s-c);margin.textContent=s?((s-c)/s*100).toFixed(1)+'%':'0%';if(!rows.length){list.className='muted';list.textContent='まだ登録がありません。';return}list.className='';list.innerHTML=rows.map(x=>{const ss=x.teams*x.team_fee,cc=x.venue_cost+x.other_cost;return `<div class="item"><div class="row"><div><b>${esc(x.event_date)}｜${esc(x.event_name)}</b><div class="muted">${x.teams}チーム × ${yen(x.team_fee)} ／ 経費 ${yen(cc)}</div>${x.memo?`<div class="muted">${esc(x.memo)}</div>`:''}</div><div style="text-align:right"><div class="money">利益 ${yen(ss-cc)}</div><button class="del" onclick="del(${x.id})">削除</button></div></div></div>`}).join('')}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}date.value=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});if(key())login();</script></body></html>
