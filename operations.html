<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今日の運営</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.w{max-width:950px;margin:auto;padding:16px}header,.card{padding:16px;border-radius:16px;margin-bottom:12px}header{background:#102a56;color:#fff}.card{background:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f7f9fc;padding:12px;border-radius:12px}.stat b{display:block;font-size:20px}.event{border-top:1px solid #eee;padding:13px 0}.warn{background:#fff7ed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,button{width:100%;padding:10px;border:1px solid #ddd;border-radius:9px}button{background:#102a56;color:#fff;font-weight:800}.muted{font-size:12px;color:#667085}.back{color:#fff}@media(max-width:650px){.stats,.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="w"><header><small>ASTERISKNOVA 管理本部</small><h1>📍 今日の運営</h1><a class="back" href="/">← 管理本部へ</a></header><section class="card"><label>確認日 <input id="date" type="date"></label><button style="margin-top:8px" onclick="load()">表示</button></section><section class="stats"><div class="stat">開催<b id="events">0件</b></div><div class="stat">参加登録<b id="people">0人</b></div><div class="stat">入金済<b id="sales">¥0</b></div><div class="stat warn">未払い<b id="unpaid">¥0</b></div></section><section class="card"><h2>🏐 今日の日程</h2><div id="eventList"></div></section><section class="card warn"><h2>⏳ 未払いチェック</h2><div id="unpaidList"></div></section><section class="card"><h2>🪪 体育館・団体カード台帳</h2><div class="grid"><input id="venue" placeholder="体育館"><input id="card" placeholder="団体カード名"><input id="memo" placeholder="メモ"><button onclick="saveCard()">台帳に保存</button></div><div id="cards"></div></section></div><script>const API='https://ymppbgyjulrkvjtlfval.supabase.co/functions/v1/admin-hq-operations',K=()=>sessionStorage.getItem('admin_hq_key')||'',yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP'),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function req(url,method='GET',body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json','x-admin-key':K()},body:body?JSON.stringify(body):undefined});if(r.status===401){location.href='/';throw Error('login')}const j=await r.json();if(!r.ok)throw Error(j.error);return j}async function load(){const d=$('date').value,j=await req(API+'?action=dashboard&date='+d),E=j.events||[],F=j.finance||[],C=j.cards||[];$('events').textContent=E.length+'件';$('people').textContent=F.length+'人';const paid=F.filter(x=>x.is_paid&&!x.free_reason).reduce((s,x)=>s+Number(x.actual_fee||0),0),unp=F.filter(x=>!x.is_paid&&!x.free_reason);$('sales').textContent=yen(paid);$('unpaid').textContent=yen(unp.reduce((s,x)=>s+Number(x.actual_fee||0),0));$('eventList').innerHTML=E.map(e=>{const f=F.filter(x=>x.schedule_event_id==e.id||(!x.schedule_event_id&&x.venue===e.venue)),sales=f.filter(x=>x.is_paid&&!x.free_reason).reduce((s,x)=>s+Number(x.actual_fee||0),0),free=f.filter(x=>x.free_reason).length,profit=sales-Number(e.venue_cost||0),card=e.card_note||C.find(c=>c.venue===e.venue)?.card_name||'';return `<div class="event"><b>${e.event_type==='practice'?'🏐':'✡️'} ${esc(e.event_time)}｜${esc(e.venue)}｜${esc(e.level)}</b><div>${card?'🪪 '+esc(card)+'　':''}${e.note?'📝 '+esc(e.note):''}</div><div class="muted">参加 ${f.length}人（無料${free}）／ 売上 ${yen(sales)} ／ 体育館代 ${yen(e.venue_cost)} ／ 利益 <b>${yen(profit)}</b></div></div>`}).join('')||'今日の日程はありません';$('unpaidList').innerHTML=unp.map(x=>`<div class="event"><b>${esc(x.participant_name)}</b>｜${esc(x.venue)}｜${yen(x.actual_fee)}</div>`).join('')||'未払いはありません';$('cards').innerHTML=C.map(c=>`<div class="event"><b>${esc(c.venue)}</b> → 🪪 ${esc(c.card_name||'未設定')}<div class="muted">${esc(c.memo||'')}</div></div>`).join('')||'まだ台帳はありません'}async function saveCard(){if(!$('venue').value.trim())return alert('体育館を入力してください');await req(API,'POST',{action:'card',venue:$('venue').value.trim(),card_name:$('card').value.trim(),memo:$('memo').value.trim(),last_used_at:$('date').value});$('venue').value=$('card').value=$('memo').value='';await load()}$('date').value=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});load();</script></body></html>
